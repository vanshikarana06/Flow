[project]
name = "flow-backend"
version = "2.0.0"
description = "FLOW — Agentic AI Personal Productivity Operating System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "litellm>=1.34.0",
    "supabase>=2.4.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]

